# Corre la validación de skills y subagentes en cada subida y en cada pull request.
# Solo usa la biblioteca estándar de Python: no instala nada.
name: Validar componentes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validar formato y separación de roles
        run: python3 -I tests/validar-componentes.py
